<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <title>{{ site.title | default: site.github.repository_name }}: {{ page.title | default: page.path }}</title>
        {% assign cssclass = 'default' %}
        {% include head.html %}
        <link rel="stylesheet" type="text/css" href="/bits/css/account.css?v={{ site.github.build_revision }}" />
        <script type="text/javascript" src="/bits/js/account.js?v={{ site.github.build_revision }}" defer></script>
    </head>
    <body>
        {% include nav.html %}
        <div class="container pagecontent">
            <div class="main pagecontainer">
                <h1>{{ page.title | default: page.path }}</h1>
                {{ content }}
                <div id="account" data-master="{{ page.master }}">
                    <noscript><p>Signing in needs JavaScript.</p></noscript>
                </div>
            </div>
            {% include footer.html %}
        </div>
    </body>
</html>
